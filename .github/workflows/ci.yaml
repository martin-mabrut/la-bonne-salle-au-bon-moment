name: CI de test pour le Front
on: [push]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm ci

      - name: Copier Node.js dans le workspace
        run: cp -a "$(dirname "$(dirname "$(which node)")")" node-local

      - name: Tar files
        run: tar -czf environnement.tar.gz node-local node_modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: environnement.tar.gz
          archive: false

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Télécharger l'environnement
        uses: actions/download-artifact@v8
        with:
          name: environnement.tar.gz

      - name: Décompresser et ajouter Node.js au PATH
        run: |
          tar -xzf environnement.tar.gz
          echo "$PWD/node-local/bin" >> "$GITHUB_PATH"

      - name: Run ESLint
        run: npm run lint

  test_and_build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Télécharger l'environnement
        uses: actions/download-artifact@v8
        with:
          name: environnement.tar.gz

      - name: Décompresser et ajouter Node.js au PATH
        run: |
          tar -xzf environnement.tar.gz
          echo "$PWD/node-local/bin" >> "$GITHUB_PATH"

      - name: Run Tests
        run: npx vitest run

      - name: Build
        run: npm run build