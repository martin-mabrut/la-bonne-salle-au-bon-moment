name: CI de test pour le Front
on: [push]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm ci

      - name: Mettre node_modules en cache réutilisable
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Récupérer node_modules depuis le cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npm run lint

  test_and_build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Récupérer node_modules depuis le cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Envoi du build dans l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist