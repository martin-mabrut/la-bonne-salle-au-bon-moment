name: CI de test pour le Front
on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npx vitest run

      - name: Build
        run: npm run build