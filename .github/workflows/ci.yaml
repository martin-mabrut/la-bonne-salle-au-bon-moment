name: CI de test pour le Front
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Sauvegarder le build en artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist