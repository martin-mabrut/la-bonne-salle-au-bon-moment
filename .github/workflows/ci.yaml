name : CI de test pour le Front
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      
name: Checkout code
      use: actions/checkout@v4

      
name: Install ESLint
      run: npm install eslint@8.10.0
name: Run ESLint
run: npm run lint
continue-on-error: true

  test_and_build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      
name: Checkout code
      uses: actions/checkout@v4
name: Installer Node.js
uses: actions/setup-node@v4
with:
  node-version: "22"
  cache: "npm"

      
name: Install Dependencies
      run: npm ci

      
name: Run Tests
      run: npm test

      
name: Build
      run: npm run build